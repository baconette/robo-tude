<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototype Viewer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #333;
      background: #fff;
      line-height: 1.5;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 32px;
    }

    .search-bar {
      position: relative;
      margin-bottom: 32px;
    }

    .search-bar svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
    }

    .search-bar input {
      width: 100%;
      padding: 10px 14px 10px 42px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
      background: #fafafa;
    }

    .search-bar input:focus {
      border-color: #999;
      background: #fff;
    }

    .section-label {
      font-size: 13px;
      font-weight: 500;
      color: #888;
      margin-bottom: 12px;
    }

    .prototype-list {
      list-style: none;
    }

    .prototype-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
      transition: background-color 0.1s;
      border-radius: 8px;
      padding-left: 8px;
      padding-right: 8px;
    }

    .prototype-item:hover {
      background-color: #f8f8f8;
    }

    .prototype-thumbnail {
      width: 64px;
      height: 48px;
      border-radius: 6px;
      background: #f0f0f0;
      flex-shrink: 0;
      object-fit: cover;
      border: 1px solid #e8e8e8;
    }

    .prototype-thumbnail-placeholder {
      width: 64px;
      height: 48px;
      border-radius: 6px;
      background: linear-gradient(135deg, #e8e8e8, #d4d4d4);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #e0e0e0;
    }

    .prototype-thumbnail-placeholder svg {
      color: #bbb;
    }

    .prototype-info {
      flex: 1;
      min-width: 0;
    }

    .prototype-name {
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .prototype-description {
      font-size: 12px;
      color: #888;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .prototype-date {
      font-size: 13px;
      color: #999;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .pagination {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 32px;
    }

    .pagination button {
      padding: 6px 14px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      color: #555;
      transition: background-color 0.1s, border-color 0.1s;
    }

    .pagination button:hover:not(:disabled) {
      background: #f5f5f5;
      border-color: #ccc;
    }

    .pagination button:disabled {
      opacity: 0.4;
      cursor: default;
    }

    .pagination .page-info {
      font-size: 13px;
      color: #888;
      min-width: 80px;
      text-align: center;
    }

    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: #999;
    }

    .empty-state p {
      font-size: 14px;
    }

    .tags {
      display: inline-flex;
      gap: 4px;
      margin-left: 8px;
    }

    .tag {
      font-size: 11px;
      padding: 1px 6px;
      background: #f0f0f0;
      border-radius: 4px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Prototypes</h1>

    <div class="search-bar">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <input type="text" id="search" placeholder="Search prototypes..." />
    </div>

    <div class="section-label">Recent prototypes</div>

    <ul class="prototype-list" id="prototype-list"></ul>

    <div class="pagination" id="pagination" style="display: none;">
      <button id="prev-btn" disabled>Previous</button>
      <span class="page-info" id="page-info"></span>
      <button id="next-btn">Next</button>
    </div>

    <div class="empty-state" id="empty-state" style="display: none;">
      <p>No prototypes found.</p>
    </div>
  </div>

  <script>
    const PER_PAGE = 10;
    let allPrototypes = [];
    let filtered = [];
    let currentPage = 1;

    async function init() {
      try {
        const res = await fetch('prototypes.json?v=' + Date.now());
        allPrototypes = await res.json();
        // Sort by lastUpdated descending
        allPrototypes.sort((a, b) => new Date(b.lastUpdated) - new Date(a.lastUpdated));
        filtered = allPrototypes;
        render();
      } catch (e) {
        document.getElementById('empty-state').style.display = 'block';
        document.querySelector('.section-label').style.display = 'none';
      }
    }

    function timeAgo(dateString) {
      const now = new Date();
      const date = new Date(dateString);
      const seconds = Math.floor((now - date) / 1000);

      const intervals = [
        { label: 'year', seconds: 31536000 },
        { label: 'month', seconds: 2592000 },
        { label: 'week', seconds: 604800 },
        { label: 'day', seconds: 86400 },
        { label: 'hour', seconds: 3600 },
        { label: 'minute', seconds: 60 },
      ];

      for (const interval of intervals) {
        const count = Math.floor(seconds / interval.seconds);
        if (count >= 1) {
          return `${count} ${interval.label}${count > 1 ? 's' : ''} ago`;
        }
      }
      return 'just now';
    }

    function render() {
      const list = document.getElementById('prototype-list');
      const pagination = document.getElementById('pagination');
      const emptyState = document.getElementById('empty-state');
      const sectionLabel = document.querySelector('.section-label');

      const totalPages = Math.ceil(filtered.length / PER_PAGE);
      const start = (currentPage - 1) * PER_PAGE;
      const page = filtered.slice(start, start + PER_PAGE);

      if (filtered.length === 0) {
        list.innerHTML = '';
        pagination.style.display = 'none';
        emptyState.style.display = 'block';
        sectionLabel.style.display = 'none';
        return;
      }

      emptyState.style.display = 'none';
      sectionLabel.style.display = 'block';

      list.innerHTML = page.map(p => {
        const thumbnailHtml = p.thumbnail
          ? `<img class="prototype-thumbnail" src="${p.thumbnail}" alt="" />`
          : `<div class="prototype-thumbnail-placeholder">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <circle cx="8.5" cy="8.5" r="1.5"></circle>
                <polyline points="21 15 16 10 5 21"></polyline>
              </svg>
            </div>`;

        const tagsHtml = p.tags && p.tags.length
          ? `<span class="tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</span>`
          : '';

        const descHtml = p.description
          ? `<div class="prototype-description">${p.description}</div>`
          : '';

        return `
          <a class="prototype-item" href="${p.folder}/" title="${p.name}">
            ${thumbnailHtml}
            <div class="prototype-info">
              <div class="prototype-name">${p.name}${tagsHtml}</div>
              ${descHtml}
            </div>
            <div class="prototype-date">${timeAgo(p.lastUpdated)}</div>
          </a>`;
      }).join('');

      if (totalPages > 1) {
        pagination.style.display = 'flex';
        document.getElementById('page-info').textContent = `${currentPage} / ${totalPages}`;
        document.getElementById('prev-btn').disabled = currentPage === 1;
        document.getElementById('next-btn').disabled = currentPage === totalPages;
      } else {
        pagination.style.display = 'none';
      }
    }

    document.getElementById('search').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      currentPage = 1;
      if (!q) {
        filtered = allPrototypes;
      } else {
        filtered = allPrototypes.filter(p => {
          const name = (p.name || '').toLowerCase();
          const desc = (p.description || '').toLowerCase();
          const tags = (p.tags || []).join(' ').toLowerCase();
          return name.includes(q) || desc.includes(q) || tags.includes(q);
        });
      }
      render();
    });

    document.getElementById('prev-btn').addEventListener('click', () => {
      if (currentPage > 1) { currentPage--; render(); }
    });

    document.getElementById('next-btn').addEventListener('click', () => {
      const totalPages = Math.ceil(filtered.length / PER_PAGE);
      if (currentPage < totalPages) { currentPage++; render(); }
    });

    init();
  </script>
</body>
</html>
