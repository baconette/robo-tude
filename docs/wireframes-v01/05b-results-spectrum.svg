<!-- ============ small state: skeleton / computing ============ -->
<text x="452" y="60" class="state-title">State: computing archetype (&lt;2s)</text>
<rect x="452" y="72" width="200" height="150" rx="16" class="frame"/>
<rect x="468" y="90" width="60" height="60" rx="10" class="shimmer"/>
<rect x="540" y="98" width="90" height="10" rx="5" class="shimmer"/>
<rect x="540" y="116" width="70" height="14" rx="4" class="shimmer"/>
<rect x="468" y="164" width="164" height="9" rx="4" class="shimmer"/>
<rect x="468" y="182" width="120" height="9" rx="4" class="shimmer"/>
<text x="452" y="242" class="label" font-size="10">Shimmer placeholder matches the</text>
<text x="452" y="256" class="label" font-size="10">Archetype Card's exact shape —</text>
<text x="452" y="270" class="label" font-size="10">icon block + two text-line blocks —</text>
<text x="452" y="284" class="label" font-size="10">so the layout doesn't jump when</text>
<text x="452" y="298" class="label" font-size="10">real content resolves (must be &lt;2s</text>
<text x="452" y="312" class="label" font-size="10">per PRD Requirement 2).</text>

<!-- legend -->
<text x="40" y="920" class="legend-title">Concept B — Per-domain spectrum bars</text>
<line x1="40" y1="932" x2="860" y2="932" stroke="#D3D1C7" stroke-width="1"/>

<text x="40" y="958" class="legend-num">1</text>
<text x="60" y="958" class="legend-text">Archetype Card — the same component as 02-landing-shared-link.svg's sharer preview, here labeled "YOUR ARCHETYPE." Name + one-line summary copy are pulled verbatim from the matching row in docs/archetype-logic.md's 22-archetype table (CMS/config-authored, not generated per visitor) — e.g. "The Backseat Driver" / "Getting around is the one place you still want a human hand on the wheel."</text>

<text x="40" y="1000" class="legend-num">1a</text>
<text x="72" y="1000" class="legend-text">Computation (server-side, per archetype-logic.md): only domains with ≥2 ratings count as "confident." &lt;2 confident domains → The Blank Slate. Otherwise compute the visitor's own baseline (equal-weighted mean of confident domains' averages), then each confident domain's deviation from that baseline. If the largest |deviation| is below the standout threshold → The Even Keel. Otherwise the domain with the largest |deviation| (ties go to the domain with more ratings) sets the archetype — warm name if deviation &gt; 0, cool name if &lt; 0.</text>

<text x="40" y="1052" class="legend-num">2</text>
<text x="60" y="1052" class="legend-text">Domain spectrum track — marker position only now; the numeric average is no longer printed inside the marker (see 3 for where the number still lives). Rows are sorted by domain and simply grow as domains are added.</text>

<text x="40" y="1078" class="legend-num">3</text>
<text x="60" y="1078" class="legend-text">Tap-to-expand summary — replaces the earlier per-use-case breakdown with a single plain-language insight sentence for that domain (editorial/templated copy, e.g. "You lean AI here — especially generative art and writing tools."). Full use-case-level detail is intentionally not shown here — too much information for this view.</text>

<text x="40" y="1104" class="legend-num">4</text>
<text x="60" y="1104" class="legend-text">Tap hint — reworded to match the summary behavior in 3, not "individual use-case ratings."</text>

<text x="40" y="1130" class="legend-num">5</text>
<text x="60" y="1130" class="legend-text">"Learn more about AI's impact" — prominent CTA into the P1 Impact Explainer (PRD Requirement 5: jobs/labor, economy, health, industry consequence cards). Given full-width primary-button weight, same as "See how you compare," since it's being surfaced deliberately, not as an afterthought. Placed after the rating content and before the compare/share actions — never before rating, per the PRD's no-priming rule. This is an entry point only; the explainer screen itself isn't wireframed here.</text>

<text x="40" y="1172" class="legend-num">6</text>
<text x="60" y="1172" class="legend-text">Primary CTA "See how you compare" — routes to the friend/aggregate comparison screen (see 06-comparison-spectrum.svg).</text>

<text x="40" y="1198" class="legend-num">7</text>
<text x="60" y="1198" class="legend-text">Two secondary actions side by side beneath the primary CTA — "Share my results" (see 07-share-results.svg for the share flow this opens) and "Rate more use cases" — replacing the earlier single low-emphasis text link. Equal visual weight, since neither is more likely than the other to be what a visitor wants next.</text>

<text x="40" y="1230" class="legend-text" font-style="italic">Pros: reads clearly at any domain count (scrollable list vs. a chart that gets crowded), directly literalizes the "human vs AI" framing from the rating scale itself, easy to scan for outliers. Cons: no single-glance "shape" of the whole profile the way a radar chart gives; feels more like a report than a portrait.</text>
</svg>
