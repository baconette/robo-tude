<line x1="66" y1="460" x2="66" y2="472" class="tick"/>
<line x1="140.5" y1="460" x2="140.5" y2="472" class="tick"/>
<line x1="215" y1="460" x2="215" y2="472" class="tick"/>
<line x1="289.5" y1="460" x2="289.5" y2="472" class="tick"/>
<line x1="364" y1="460" x2="364" y2="472" class="tick"/>
<line x1="278" y1="466" x2="298" y2="466" class="connector"/>
<circle cx="278" cy="466" r="9" class="markeryou"/>
<circle cx="298" cy="466" r="9" class="markerfriend"/>
</g>

<g>
<text x="66" y="512" class="title" font-size="12">Education</text>
<line x1="66" y1="538" x2="364" y2="538" class="track"/>
<line x1="66" y1="532" x2="66" y2="544" class="tick"/>
<line x1="140.5" y1="532" x2="140.5" y2="544" class="tick"/>
<line x1="215" y1="532" x2="215" y2="544" class="tick"/>
<line x1="289.5" y1="532" x2="289.5" y2="544" class="tick"/>
<line x1="364" y1="532" x2="364" y2="544" class="tick"/>
<line x1="200" y1="538" x2="230" y2="538" class="connector"/>
<circle cx="200" cy="538" r="9" class="markeryou"/>
<circle cx="230" cy="538" r="9" class="markerfriend"/>
</g>

<g>
<text x="66" y="584" class="title" font-size="12">Mobility</text>
<line x1="66" y1="610" x2="364" y2="610" class="track"/>
<line x1="66" y1="604" x2="66" y2="616" class="tick"/>
<line x1="140.5" y1="604" x2="140.5" y2="616" class="tick"/>
<line x1="215" y1="604" x2="215" y2="616" class="tick"/>
<line x1="289.5" y1="604" x2="289.5" y2="616" class="tick"/>
<line x1="364" y1="604" x2="364" y2="616" class="tick"/>
<line x1="210" y1="610" x2="108" y2="610" class="connector"/>
