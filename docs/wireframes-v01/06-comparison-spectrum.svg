<svg viewBox="0 0 900 1300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Wireframe: Comparison visualization — you + your friend (Feature 3)</title>
<desc>Mid-fi annotated wireframe for Feature 3 (Comparison Visualization), previously marked out of scope — now wireframed per instruction, built on the chosen spectrum concept from 05b-results-spectrum.svg. Default view is the sharer/friend comparison; an "Everyone" tab covers the aggregate view gated by the 25-respondent threshold (PRD Requirement 3).</desc>
<style>
.frame { fill:#FFFFFF; stroke:#2C2C2A; stroke-width:2; }
.box { fill:#FFFFFF; stroke:#D3D1C7; stroke-width:1.5; }
.dynamicbox { fill:#F1EFE8; stroke:#D3D1C7; stroke-width:1.5; }
.ximg { fill:#F6F5F1; stroke:#B9B7AC; stroke-width:1.5; }
.ximgline { stroke:#B9B7AC; stroke-width:1.5; }
.label { font-size:11.5px; fill:#5F5E5A; font-family: Arial, sans-serif; }
.endlabel { font-size:9.5px; font-weight:700; fill:#8C8A82; font-family: Arial, sans-serif; letter-spacing:0.4px; }
.title { font-size:15px; font-weight:600; fill:#2C2C2A; font-family: Arial, sans-serif; }
.archlabel { font-size:8.5px; font-weight:700; fill:#8C8A82; font-family: Arial, sans-serif; letter-spacing:0.4px; }
.archname { font-size:11px; font-weight:700; fill:#2C2C2A; font-family: Arial, sans-serif; }
.tabactive { fill:#2C2C2A; }
.tabactivetext { fill:#FFFFFF; font-size:12px; font-weight:600; font-family: Arial, sans-serif; }
.tabinactive { fill:#FFFFFF; stroke:#D3D1C7; stroke-width:1.5; }
.tabinactivetext { fill:#5F5E5A; font-size:12px; font-weight:600; font-family: Arial, sans-serif; }
.track { stroke:#D3D1C7; stroke-width:3; stroke-linecap:round; }
.tick { stroke:#D3D1C7; stroke-width:1.5; }
.connector { stroke:#B9B7AC; stroke-width:1.5; }
.markeryou { fill:#2C2C2A; }
.markerfriend { fill:#F1EFE8; stroke:#2C2C2A; stroke-width:2; }
.btn { fill:#2C2C2A; }
.btntext { fill:#FFFFFF; font-size:14px; font-weight:600; font-family: Arial, sans-serif; }
.link { fill:#5F5E5A; font-size:12px; font-family: Arial, sans-serif; text-decoration:underline; }
.impacticon { fill:#FFFFFF; fill-opacity:0.15; }
.impacticontext { fill:#FFFFFF; font-size:13px; font-weight:700; font-family: Arial, sans-serif; }
.impactsub { fill:#B9B7AC; font-size:10px; font-family: Arial, sans-serif; }
.state-title { font-size:12px; font-weight:700; fill:#2C2C2A; font-family: Arial, sans-serif; }
.callout { fill:#2C2C2A; }
.callouttext { fill:#FFFFFF; font-size:11px; font-weight:700; font-family: Arial, sans-serif; }
.leader { stroke:#B9B7AC; stroke-width:1; stroke-dasharray:2,2; }
.legend-title { font-size:13px; font-weight:700; fill:#2C2C2A; font-family: Arial, sans-serif; }
.legend-text { font-size:12px; fill:#3A3A38; font-family: Arial, sans-serif; }
.legend-num { font-size:12px; font-weight:700; fill:#2C2C2A; font-family: Arial, sans-serif; }
</style>

<!-- ============ MAIN: friend comparison (default) ============ -->
<rect x="40" y="40" width="350" height="720" rx="26" class="frame"/>

<!-- back, top-left — same pattern/position as 03-rating-card.svg's back button -->
