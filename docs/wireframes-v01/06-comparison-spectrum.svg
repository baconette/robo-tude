<text x="138.5" y="149" text-anchor="middle" class="tabactivetext">Friend</text>
<rect x="219" y="130" width="145" height="28" rx="14" class="tabinactive"/>
<text x="291.5" y="149" text-anchor="middle" class="tabinactivetext">Everyone</text>

<!-- compact archetype cards, you + friend -->
