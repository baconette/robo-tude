<!-- prominent CTA: AI impact explainer (Feature 5, P1) -->
<rect x="66" y="632" width="298" height="58" rx="8" class="btn"/>
<circle cx="100" cy="661" r="16" class="impacticon"/>
<text x="100" y="666" text-anchor="middle" class="impacticontext">i</text>
<text x="126" y="656" class="btntext" font-size="13.5">Learn more about AI's impact →</text>
<text x="126" y="674" class="impactsub">Jobs · Economy · Health · Industry</text>

<!-- callouts -->
<circle cx="400" cy="82" r="10" class="callout"/><text x="400" y="86" text-anchor="middle" class="callouttext">1</text>
<line x1="390" y1="82" x2="368" y2="82" class="leader"/>

<circle cx="400" cy="144" r="10" class="callout"/><text x="400" y="148" text-anchor="middle" class="callouttext">2</text>
<line x1="390" y1="144" x2="364" y2="144" class="leader"/>

<circle cx="400" cy="226" r="10" class="callout"/><text x="400" y="230" text-anchor="middle" class="callouttext">3</text>
<line x1="390" y1="226" x2="364" y2="226" class="leader"/>

<circle cx="400" cy="296" r="10" class="callout"/><text x="400" y="300" text-anchor="middle" class="callouttext">4</text>
<line x1="390" y1="296" x2="330" y2="296" class="leader"/>

<circle cx="400" cy="319" r="10" class="callout"/><text x="400" y="323" text-anchor="middle" class="callouttext">5</text>
<line x1="390" y1="319" x2="364" y2="319" class="leader"/>

<circle cx="400" cy="346" r="10" class="callout"/><text x="400" y="350" text-anchor="middle" class="callouttext">6</text>
<line x1="390" y1="346" x2="142" y2="346" class="leader"/>

<circle cx="400" cy="394" r="10" class="callout"/><text x="400" y="398" text-anchor="middle" class="callouttext">7</text>
<line x1="390" y1="394" x2="364" y2="394" class="leader"/>

<circle cx="400" cy="661" r="10" class="callout"/><text x="400" y="665" text-anchor="middle" class="callouttext">8</text>
<line x1="390" y1="661" x2="364" y2="661" class="leader"/>

<!-- ============ small state: Everyone tab, threshold not met ============ -->
<text x="452" y="60" class="state-title">State: "Everyone" tab, threshold not met</text>
<rect x="452" y="72" width="220" height="180" rx="16" class="frame"/>
<text x="472" y="100" class="title" font-size="13">You vs. everyone</text>
<rect x="472" y="112" width="90" height="22" rx="11" class="tabinactive"/>
<text x="517" y="127" text-anchor="middle" class="tabinactivetext" font-size="10">Friend</text>
<rect x="568" y="112" width="90" height="22" rx="11" class="tabactive"/>
<text x="613" y="127" text-anchor="middle" class="tabactivetext" font-size="10">Everyone</text>
<rect x="472" y="150" width="186" height="80" class="box" stroke-dasharray="3,3"/>
<text x="565" y="178" text-anchor="middle" class="label" font-size="10.5">Aggregate not ready yet</text>
<text x="565" y="196" text-anchor="middle" class="label" font-size="10.5">12 of 25 responses needed</text>
<text x="565" y="214" text-anchor="middle" class="label" font-size="10.5">to protect against skew</text>
<text x="452" y="272" class="label" font-size="10">Per PRD Requirement 3: aggregate</text>
<text x="452" y="286" class="label" font-size="10">is withheld below a 25-respondent</text>
<text x="452" y="300" class="label" font-size="10">minimum. Friend comparison has</text>
<text x="452" y="314" class="label" font-size="10">no such gate — n=1, always shown.</text>

<!-- legend -->
<text x="40" y="800" class="legend-title">Feature 3 — Comparison Visualization (spectrum concept)</text>
<line x1="40" y1="812" x2="860" y2="812" stroke="#D3D1C7" stroke-width="1"/>

<text x="40" y="838" class="legend-num">1</text>
<text x="60" y="838" class="legend-text">Back — top-left, same position and style as the back button on 03-rating-card.svg, so the "how do I leave this screen" pattern stays consistent across the app. Returns to 05b (the visitor's own results), replacing the "Back to my results" text link that previously sat at the bottom of this screen.</text>

<text x="40" y="864" class="legend-num">2</text>
<text x="60" y="864" class="legend-text">Friend / Everyone tabs — per PRD Requirement 3, friend comparison is the default view; Everyone (aggregate of all visitors) is a second tab, not a separate screen. Switching tabs does not re-fetch the visitor's own data, only the comparison side.</text>

<text x="40" y="890" class="legend-num">3</text>
<text x="60" y="890" class="legend-text">Compact Archetype Cards, one per person — same component as 05b's own-results header and 02's sharer preview, condensed (icon + name + one short line) to fit two side by side. "Your friend" copy, never a name, consistent with 02.</text>

<text x="40" y="916" class="legend-num">4</text>
<text x="60" y="916" class="legend-text">"Agree most / diverge most" insight — surfaces the PRD's "feel genuine surprise or validation" goal in one line, right where a section header used to sit. Computation (which domain counts as biggest agreement vs. divergence) is a simple |average-you − average-them| comparison per domain — this is a distinct metric from the archetype standout logic in docs/archetype-logic.md and isn't yet specified there; flagging as an open item for whoever owns that logic next.</text>

<text x="40" y="958" class="legend-num">5</text>
<text x="60" y="958" class="legend-text">Sort control — the rows below are ordered by the same per-domain agreement metric as annotation 4, ascending: most-agreement (smallest |average-you − average-them| gap) at the top, most-disagreement at the bottom. This is the default; tapping the pill reverses the order to most-disagreement first. State is a simple ascending/descending flag, not a full custom sort — no per-domain manual reordering.</text>

<text x="40" y="1000" class="legend-num">6</text>
<text x="60" y="1000" class="legend-text">Marker key — solid dark circle = you, outlined circle = the other party. Placed directly above the first domain row rather than up near the tabs, so it reads immediately before the marker pairs it's explaining. Deliberately distinct from the dashed/hollow "empty" marker used in 02-landing-shared-link.svg's teaser (that one meant "not rated yet"; this one is real data for both people).</text>

<text x="40" y="1042" class="legend-num">7</text>
<text x="60" y="1042" class="legend-text">Comparison row — same track as 05b, now with two markers plus a thin connector line so the gap between the two people reads visually, not just numerically (that visual gap width is exactly what the sort in 5 orders by). No values printed inside markers, consistent with 05b.</text>

<text x="40" y="1068" class="legend-num">8</text>
<text x="60" y="1068" class="legend-text">"Learn more about AI's impact" — same prominent, full-width CTA as on 05b-results-spectrum.svg, into the P1 Impact Explainer (PRD Requirement 5). Placed after the comparison rows so it doesn't compete with the primary comparison content above it. Entry point only; the explainer screen itself isn't wireframed here.</text>

<text x="40" y="1100" class="legend-text" font-style="italic">Responsive: ≥768px puts the two Archetype Cards and the tab control in a fixed-width column, comparison rows can widen but keep a max track width (~420px) so marker positions stay legible. Accessibility: marker shapes (filled vs. outlined), not color alone, distinguish "you" from "them" — safe for color-blind and grayscale contexts. The sort pill needs a clear focus state and an aria-pressed/aria-label announcing current order, since it's the one control on this screen that changes content order.</text>
</svg>
