<svg viewBox="0 0 900 1160" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Wireframe: Use case rating card</title>
<desc>Mid-fi annotated wireframe of the core P0 rating interaction — domain badge, jargon-free use case text, 1-5 scale, back button, progress, and the optional request-explanation action. Shows default, selected, and error states per PRD Requirement 1 and flow-rating-module.svg.</desc>
<style>
.frame { fill:#FFFFFF; stroke:#2C2C2A; stroke-width:2; }
.box { fill:#FFFFFF; stroke:#D3D1C7; stroke-width:1.5; }
.optional { fill:#FFFFFF; stroke:#D3D1C7; stroke-width:1.5; stroke-dasharray:4,3; }
.wavy-body { font-size:19px; fill:#2C2C2A; font-family: Arial, sans-serif; letter-spacing:-2px; }
.wavy-sm { font-size:13px; fill:#8C8A82; font-family: Arial, sans-serif; letter-spacing:-1.5px; }
.label { font-size:11.5px; fill:#5F5E5A; font-family: Arial, sans-serif; }
.title { font-size:13px; font-weight:600; fill:#2C2C2A; font-family: Arial, sans-serif; }
.scaleseg { fill:#FFFFFF; stroke:#2C2C2A; stroke-width:1.5; }
.scalesegfill { fill:#2C2C2A; stroke:#2C2C2A; stroke-width:1.5; }
.scaletext { fill:#2C2C2A; font-size:11px; font-weight:600; font-family: Arial, sans-serif; }
.scaletextfill { fill:#FFFFFF; font-size:11px; font-weight:600; font-family: Arial, sans-serif; }
.scalenum { fill:#8C8A82; font-size:10px; font-family: Arial, sans-serif; }
.badge { fill:#F1EFE8; stroke:#D3D1C7; stroke-width:1; }
.badgetext { fill:#5F5E5A; font-size:10px; font-weight:700; font-family: Arial, sans-serif; letter-spacing:0.5px; }
.link { fill:#5F5E5A; font-size:12px; font-family: Arial, sans-serif; }
.progressbg { fill:#EDEBE3; }
.progressfill { fill:#2C2C2A; }
.segdone { fill:#2C2C2A; }
.segcurrent { fill:#2C2C2A; fill-opacity:0.35; }
.segupcoming { fill:#EDEBE3; }
.callout { fill:#2C2C2A; }
.callouttext { fill:#FFFFFF; font-size:11px; font-weight:700; font-family: Arial, sans-serif; }
.leader { stroke:#B9B7AC; stroke-width:1; stroke-dasharray:2,2; }
.legend-title { font-size:13px; font-weight:700; fill:#2C2C2A; font-family: Arial, sans-serif; }
.legend-text { font-size:12px; fill:#3A3A38; font-family: Arial, sans-serif; }
.legend-num { font-size:12px; font-weight:700; fill:#2C2C2A; font-family: Arial, sans-serif; }
.state-title { font-size:12px; font-weight:700; fill:#2C2C2A; font-family: Arial, sans-serif; }
.btn { fill:#2C2C2A; }
.btntext { fill:#FFFFFF; font-size:13px; font-weight:600; font-family: Arial, sans-serif; }
</style>

<!-- ============ MAIN: default state ============ -->
<rect x="40" y="40" width="350" height="820" rx="26" class="frame"/>

<!-- top bar -->
<text x="66" y="82" class="title">← Back</text>
<text x="368" y="82" text-anchor="end" class="label">Card 4 of 10</text>
<!-- segmented progress: 10 sections, one per card in this bundle -->
<g>
<rect x="66" y="94" width="26" height="7" rx="3" class="segdone"/>
<rect x="96" y="94" width="26" height="7" rx="3" class="segdone"/>
<rect x="126" y="94" width="26" height="7" rx="3" class="segdone"/>
<rect x="156" y="94" width="26" height="7" rx="3" class="segcurrent"/>
<rect x="186" y="94" width="26" height="7" rx="3" class="segupcoming"/>
<rect x="216" y="94" width="26" height="7" rx="3" class="segupcoming"/>
<rect x="246" y="94" width="26" height="7" rx="3" class="segupcoming"/>
<rect x="276" y="94" width="26" height="7" rx="3" class="segupcoming"/>
<rect x="306" y="94" width="26" height="7" rx="3" class="segupcoming"/>
<rect x="336" y="94" width="28" height="7" rx="3" class="segupcoming"/>
</g>

<!-- domain badge -->
<rect x="66" y="126" width="110" height="24" rx="12" class="badge"/>
<text x="121" y="142" text-anchor="middle" class="badgetext">HEALTHCARE</text>

<!-- use case text -->
<text x="66" y="198" class="wavy-body">∿∿∿∿∿∿∿∿∿∿∿∿∿∿</text>
<text x="66" y="226" class="wavy-body">∿∿∿∿∿∿∿∿∿∿∿∿∿∿∿∿∿</text>
<text x="66" y="254" class="wavy-body">∿∿∿∿∿∿∿∿</text>

<!-- request explanation, moved directly under the use case text -->
<rect x="66" y="270" width="298" height="34" rx="6" class="optional"/>
<text x="215" y="291" text-anchor="middle" class="link" font-size="11">🏳 I don't understand this use case</text>

<!-- rating scale -->
<text x="66" y="332" class="label">Who should do this — a human or an AI?</text>
<g>
<rect x="66" y="348" width="52" height="72" rx="6" class="scaleseg"/>
<text x="92" y="374" text-anchor="middle" class="scaletext">Never</text>
<text x="92" y="408" text-anchor="middle" class="scalenum">1</text>

<rect x="122" y="348" width="52" height="72" rx="6" class="scaleseg"/>
<text x="148" y="374" text-anchor="middle" class="scaletext">Some</text>
<text x="148" y="408" text-anchor="middle" class="scalenum">2</text>

<rect x="178" y="348" width="52" height="72" rx="6" class="scaleseg"/>
<text x="204" y="374" text-anchor="middle" class="scaletext">Neutral</text>
<text x="204" y="408" text-anchor="middle" class="scalenum">3</text>

<rect x="234" y="348" width="52" height="72" rx="6" class="scaleseg"/>
<text x="260" y="374" text-anchor="middle" class="scaletext">Most</text>
<text x="260" y="408" text-anchor="middle" class="scalenum">4</text>

<rect x="290" y="348" width="74" height="72" rx="6" class="scaleseg"/>
<text x="327" y="374" text-anchor="middle" class="scaletext">Always</text>
<text x="327" y="408" text-anchor="middle" class="scalenum">5</text>
</g>

<!-- callouts -->
<circle cx="400" cy="82" r="10" class="callout"/><text x="400" y="86" text-anchor="middle" class="callouttext">1</text>
<line x1="390" y1="82" x2="368" y2="82" class="leader"/>

<circle cx="400" cy="97" r="10" class="callout"/><text x="400" y="101" text-anchor="middle" class="callouttext">2</text>
<line x1="390" y1="97" x2="364" y2="97" class="leader"/>

<circle cx="400" cy="138" r="10" class="callout"/><text x="400" y="142" text-anchor="middle" class="callouttext">3</text>
<line x1="390" y1="138" x2="176" y2="138" class="leader"/>

<circle cx="400" cy="226" r="10" class="callout"/><text x="400" y="230" text-anchor="middle" class="callouttext">4</text>
<line x1="390" y1="226" x2="330" y2="226" class="leader"/>

<circle cx="400" cy="287" r="10" class="callout"/><text x="400" y="291" text-anchor="middle" class="callouttext">5</text>
<line x1="390" y1="287" x2="364" y2="287" class="leader"/>

<circle cx="400" cy="384" r="10" class="callout"/><text x="400" y="388" text-anchor="middle" class="callouttext">6</text>
<line x1="390" y1="384" x2="364" y2="384" class="leader"/>

<!-- ============ small state: selected ============ -->
<text x="452" y="60" class="state-title">State: selected (rated "Most")</text>
<rect x="452" y="72" width="200" height="380" rx="16" class="frame"/>
<text x="472" y="100" class="title">← Back</text>
<text x="632" y="100" text-anchor="end" class="label">Card 4 of 10</text>
<g>
<rect x="472" y="110" width="14" height="6" rx="2" class="segdone"/>
<rect x="488" y="110" width="14" height="6" rx="2" class="segdone"/>
<rect x="504" y="110" width="14" height="6" rx="2" class="segdone"/>
<rect x="520" y="110" width="14" height="6" rx="2" class="segcurrent"/>
<rect x="536" y="110" width="14" height="6" rx="2" class="segupcoming"/>
<rect x="552" y="110" width="14" height="6" rx="2" class="segupcoming"/>
<rect x="568" y="110" width="14" height="6" rx="2" class="segupcoming"/>
<rect x="584" y="110" width="14" height="6" rx="2" class="segupcoming"/>
<rect x="600" y="110" width="14" height="6" rx="2" class="segupcoming"/>
<rect x="616" y="110" width="14" height="6" rx="2" class="segupcoming"/>
</g>
<rect x="472" y="132" width="80" height="18" rx="9" class="badge"/>
<text x="512" y="145" text-anchor="middle" class="badgetext" font-size="8">HEALTHCARE</text>
<text x="472" y="178" class="wavy-body" font-size="14">∿∿∿∿∿∿∿∿∿</text>
<text x="472" y="198" class="wavy-body" font-size="14">∿∿∿∿∿∿∿∿∿∿∿</text>
<g>
<rect x="472" y="220" width="34" height="46" rx="4" class="scaleseg"/>
<rect x="510" y="220" width="34" height="46" rx="4" class="scaleseg"/>
<rect x="548" y="220" width="34" height="46" rx="4" class="scaleseg"/>
<rect x="586" y="220" width="34" height="46" rx="4" class="scalesegfill"/>
<text x="603" y="247" text-anchor="middle" class="scaletextfill" font-size="9">Most</text>
<rect x="624" y="220" width="28" height="46" rx="4" class="scaleseg"/>
</g>
<text x="472" y="290" class="label" font-size="10">Selection highlights instantly,</text>
<text x="472" y="304" class="label" font-size="10">then auto-advances to the next</text>
<text x="472" y="318" class="label" font-size="10">card after ~400ms — no separate</text>
<text x="472" y="332" class="label" font-size="10">"Next" tap required.</text>
<text x="472" y="358" class="label" font-size="10">Tapping a different segment before</text>
<text x="472" y="372" class="label" font-size="10">advancing overrides the rating.</text>

<!-- ============ small state: error ============ -->
<text x="452" y="484" class="state-title">State: card failed to load</text>
<rect x="452" y="496" width="200" height="240" rx="16" class="frame"/>
<text x="472" y="524" class="title">← Back</text>
<text x="632" y="524" text-anchor="end" class="label">Card 4 of 10</text>
<rect x="472" y="546" width="160" height="90" class="box" stroke-dasharray="3,3"/>
<text x="552" y="580" text-anchor="middle" class="label">Couldn't load this</text>
<text x="552" y="596" text-anchor="middle" class="label">use case.</text>
<rect x="512" y="612" width="80" height="30" rx="6" class="btn"/>
<text x="552" y="631" text-anchor="middle" class="btntext">Retry</text>
<text x="472" y="662" class="label" font-size="10">Progress and prior ratings in this</text>
<text x="472" y="676" class="label" font-size="10">bundle are preserved; only the</text>
<text x="472" y="690" class="label" font-size="10">current card is affected.</text>

<!-- legend -->
<text x="40" y="900" class="legend-title">Annotations</text>
<line x1="40" y1="912" x2="860" y2="912" stroke="#D3D1C7" stroke-width="1"/>

<text x="40" y="938" class="legend-num">1</text>
<text x="60" y="938" class="legend-text">Back button — returns to the previous rated card so the visitor can change an earlier answer (PRD: "can go back by clicking a back button"). Disabled/hidden on card 1 of a bundle.</text>

<text x="40" y="964" class="legend-num">2</text>
<text x="60" y="964" class="legend-text">Segmented progress bar — one section per card in the 10-card bundle (not a continuous fill). Sections to the left of the current card are solid (done), the current card's section is a lighter tint (in progress), the rest are empty. Makes the fixed bundle size ("10 use cases") legible as discrete steps, not just a percentage.</text>

<text x="40" y="1000" class="legend-num">3</text>
<text x="60" y="1000" class="legend-text">Domain badge — always visible per acceptance criteria. Source: use_cases → domains join (Supabase), static per card, no client logic.</text>

<text x="40" y="1026" class="legend-num">4</text>
<text x="60" y="1026" class="legend-text">Use case text — priority 1 content on the card. CMS/Notion-authored, jargon-free, ~1-2 sentences, no prior AI knowledge required.</text>

<text x="40" y="1052" class="legend-num">5</text>
<text x="60" y="1052" class="legend-text">"I don't understand this" — moved directly under the use case text (previously sat below the rating scale), so the flag action is read in the same glance as the text it's flagging rather than after the visitor has already rated it. Still optional, non-blocking: flags the use case for the content team, shows a brief inline confirmation toast, does not interrupt rating.</text>

<text x="40" y="1078" class="legend-num">6</text>
<text x="60" y="1078" class="legend-text">1–5 rating scale — Never/Some/Neutral/Most/Always. Touch and mouse compatible; each segment is a single tap target (min 48×48pt). Selecting a segment auto-advances (see "selected" state) — no separate submit step.</text>

<text x="40" y="1100" class="legend-text" font-style="italic">Responsive: ≥768px centers the card at a fixed max-width (~480px) rather than stretching full-bleed; scale segments grow proportionally. Accessibility: scale is a radiogroup (one selection), arrow-key navigable; "Back" and "request explanation" both keyboard-reachable and screen-reader labeled.</text>
</svg>
