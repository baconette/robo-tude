<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Combined overview flow: Feature 1 rating module into Feature 2 results visualization</title>
<desc>High-level view showing the rating module subflow handing off into the results visualization subflow, with shared entry and eventual handoff to the out-of-scope aggregate view.</desc>
<defs>
<marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/>
</marker>
</defs>
<style>
.box { fill: #FFFFFF; stroke: #D3D1C7; stroke-width:1.5; }
.subprocess { fill: #FFFFFF; stroke: #D3D1C7; stroke-width:1.5; }
.subprocess-bar { fill: none; stroke: #D3D1C7; stroke-width:1.5; }
.decision { fill: #F1EFE8; stroke: #D3D1C7; stroke-width:1.5; }
.end { fill: #FFFFFF; stroke: #2C2C2A; stroke-width:2; }
.entry { fill: #2C2C2A; }
.title { font-size:14px; font-weight:600; fill: #2C2C2A; font-family: Arial, sans-serif; }
.sub { font-size:11px; fill: #5F5E5A; font-family: Arial, sans-serif; }
.label { font-size:11px; fill: #5F5E5A; font-family: Arial, sans-serif; }
.entrylabel { font-size:12px; font-weight:600; fill: #FFFFFF; font-family: Arial, sans-serif; }
.edge { stroke: #5F5E5A; stroke-width:1.5; fill:none; marker-end:url(#arrow4); }
</style>

<ellipse cx="150" cy="60" rx="80" ry="26" class="entry"/>
<text x="150" y="65" text-anchor="middle" class="entrylabel">Visitor arrives</text>
<path class="edge" d="M230,60 L300,60"/>

<rect x="300" y="20" width="260" height="80" class="subprocess"/>
<line x1="315" y1="20" x2="315" y2="100" class="subprocess-bar"/>
<line x1="545" y1="20" x2="545" y2="100" class="subprocess-bar"/>
<text x="430" y="50" text-anchor="middle" class="title">Rating module</text>
<text x="430" y="68" text-anchor="middle" class="sub">Feature 1 — rate loop,</text>

<path class="edge" d="M560,60 L620,60"/>

<ellipse cx="700" cy="60" rx="90" ry="24" class="end"/>
<text x="700" y="56" text-anchor="middle" class="title">Bundle ratings</text>
<text x="700" y="70" text-anchor="middle" class="sub">complete</text>

<path class="edge" d="M700,84 L700,140"/>

<rect x="570" y="140" width="260" height="80" class="subprocess"/>
<line x1="585" y1="140" x2="585" y2="220" class="subprocess-bar"/>
<line x1="815" y1="140" x2="815" y2="220" class="subprocess-bar"/>
<text x="700" y="170" text-anchor="middle" class="title">Results visualization</text>
<text x="700" y="188" text-anchor="middle" class="sub">Feature 2 — compute, render</text>
<text x="700" y="203" text-anchor="middle" class="sub">profile, view detail on demand</text>

<path class="edge" d="M700,220 L700,270"/>

<ellipse cx="700" cy="320" rx="140" ry="32" class="end"/>
<text x="700" y="316" text-anchor="middle" class="title">Views full individual results</text>
<text x="700" y="332" text-anchor="middle" class="sub">to Feature 3 — Aggregate (out of scope)</text>

<path class="edge" d="M430,100 C430,340 250,340 150,300" stroke-dasharray="4,3"/>
<ellipse cx="150" cy="330" rx="110" ry="28" class="end"/>
<text x="150" y="326" text-anchor="middle" class="title">Leaves mid-bundle</text>
<text x="150" y="342" text-anchor="middle" class="sub">no penalty (v1)</text>

<rect x="60" y="440" width="16" height="46" class="subprocess"/>
<line x1="63" y1="440" x2="63" y2="486" class="subprocess-bar"/>
<line x1="73" y1="440" x2="73" y2="486" class="subprocess-bar"/>
<text x="86" y="468" class="label">subprocess (see detailed flow diagram for this feature)</text>
<text x="60" y="520" class="sub">Detail lives in separate diagrams: flow-rating-module.svg (Feature 1) and</text>
<text x="60" y="536" class="sub">flow-results-visualization.svg (Feature 2). This view is for handoff/dependency framing only.</text>
</svg>
