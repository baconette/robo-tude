<svg viewBox="0 0 1100 1240" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Feature 1 user flow, updated for PRD v0.5 bundle model</title>
<desc>Restores the arrival-type decision before start rating. First-time visitors rate 10 featured use cases (2 per domain, across 5 domains); returning visitors rate 10 randomized use cases per bundle, with domain badges now shown on each use case card. Rating is a 1-5 scale. The optional negative-pole "why" free-text field has been removed. After each bundle, visitor chooses to view cumulative results or continue with another randomized bundle. Includes request-explanation action.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#5F5E5A"/>
</marker>
</defs>
<style>
.box { fill: #FFFFFF; stroke: #D3D1C7; stroke-width:1.5; }
.decision { fill: #F1EFE8; stroke: #D3D1C7; stroke-width:1.5; }
.optional { fill: #FFFFFF; stroke: #D3D1C7; stroke-width:1.5; stroke-dasharray:4,3; }
.end { fill: #FFFFFF; stroke: #2C2C2A; stroke-width:2; }
.entry { fill: #2C2C2A; }
.title { font-size:14px; font-weight:600; fill: #2C2C2A; font-family: Arial, sans-serif; }
.sub { font-size:11px; fill: #5F5E5A; font-family: Arial, sans-serif; }
.label { font-size:11px; fill: #5F5E5A; font-family: Arial, sans-serif; }
.entrylabel { font-size:12px; font-weight:600; fill: #FFFFFF; font-family: Arial, sans-serif; }
.edge { stroke: #5F5E5A; stroke-width:1.5; fill:none; marker-end:url(#arrow2); }
</style>

<ellipse cx="550" cy="30" rx="70" ry="24" class="entry"/>
<text x="550" y="35" text-anchor="middle" class="entrylabel">Visitor arrives</text>
<path class="edge" d="M550,54 L550,70"/>

<polygon points="550,70 650,110 550,150 450,110" class="decision"/>
<text x="550" y="106" text-anchor="middle" class="title">Arrival</text>
<text x="550" y="122" text-anchor="middle" class="sub">type?</text>

<rect x="0" y="181" width="260" height="80" class="box"/>
<line x1="15" y1="181" x2="15" y2="261" stroke="#D3D1C7" stroke-width="1.5"/>
<line x1="245" y1="181" x2="245" y2="261" stroke="#D3D1C7" stroke-width="1.5"/>
<text x="130" y="217" text-anchor="middle" class="title">Views full individual results</text>
<text x="130" y="232" text-anchor="middle" class="sub">to Feature 3 — Aggregate</text>

<rect x="330" y="190" width="180" height="72" class="box"/>
<text x="420" y="215" text-anchor="middle" class="title">Landing screen</text>
<text x="420" y="233" text-anchor="middle" class="sub">explains concept in &lt;10s</text>
<text x="420" y="248" text-anchor="middle" class="sub">can enter a code to see a previous session</text>
<path class="edge" d="M450,110 L420,190"/>
<text x="380" y="160" class="label">direct / organic</text>
<path class="edge" d="M330,220 L260,220"/>

<rect x="590" y="190" width="200" height="70" class="box"/>
<text x="690" y="213" text-anchor="middle" class="title">Landing screen</text>
<text x="690" y="230" text-anchor="middle" class="sub">+ sharer's profile preview</text>
<text x="690" y="246" text-anchor="middle" class="sub">"see how yours compares"</text>
<path class="edge" d="M650,110 L690,190"/>
<text x="640" y="160" class="label">shared link</text>

<rect x="440" y="300" width="220" height="60" class="box"/>
<text x="550" y="322" text-anchor="middle" class="title">Start rating</text>
<text x="550" y="339" text-anchor="middle" class="sub">first-time visitor: 10 featured use cases</text>
<text x="550" y="353" text-anchor="middle" class="sub">else: 10 randomized use cases per bundle</text>
<path class="edge" d="M420,250 L470,300"/>
<path class="edge" d="M690,260 L630,300"/>

<path class="edge" d="M550,360 L550,390"/>

<rect x="330" y="390" width="220" height="80" class="box"/>
<text x="440" y="435" text-anchor="middle" class="title">Use case card</text>
<text x="440" y="453" text-anchor="middle" class="sub">domain badge shown</text>

<rect x="620" y="400" width="220" height="60" class="optional"/>
<text x="730" y="425" text-anchor="middle" class="title">Requests explanation</text>
<text x="730" y="442" text-anchor="middle" class="sub">flags for content team, non-blocking</text>
<path class="edge" d="M550,430 L620,430"/>
<text x="560" y="420" class="label">optional</text>

<path class="edge" d="M440,470 L440,500"/>

<rect x="330" y="500" width="220" height="60" class="box"/>
<text x="440" y="525" text-anchor="middle" class="title">Rates use case</text>
<text x="440" y="542" text-anchor="middle" class="sub">1-5 scale, progress advances</text>

<path class="edge" d="M440,560 L440,590"/>

<polygon points="440,590 540,630 440,670 340,630" class="decision"/>
<text x="440" y="626" text-anchor="middle" class="title">More use cases</text>
<text x="440" y="642" text-anchor="middle" class="sub">left in bundle?</text>

<path class="edge" d="M340,625 C240,625 240,430 330,430" />
<text x="150" y="470" class="label">yes, next card</text>
<text x="150" y="484" class="label">in this bundle</text>

<ellipse cx="820" cy="630" rx="120" ry="30" class="end"/>
<text x="820" y="626" text-anchor="middle" class="title">Leaves mid-bundle</text>
<text x="820" y="642" text-anchor="middle" class="sub">no penalty, no save (v1)</text>
<path class="edge" d="M550,535 C700,545 820,570 820,600" stroke-dasharray="4,3"/>

<path class="edge" d="M440,670 L440,730"/>
<text x="470" y="700" class="label">no, bundle done</text>

<polygon points="440,730 540,770 440,810 340,770" class="decision"/>
<text x="440" y="766" text-anchor="middle" class="title">View results or</text>
<text x="440" y="782" text-anchor="middle" class="sub">continue rating?</text>

<path class="edge" d="M340,770 C110,770 110,430 330,430"/>
<text x="20" y="510" class="label">continue: new</text>
<text x="20" y="524" class="label">random bundle</text>

<path class="edge" d="M440,810 L440,850"/>
<text x="470" y="840" class="label">view results</text>

<ellipse cx="440" cy="900" rx="170" ry="36" class="end"/>
<text x="440" y="895" text-anchor="middle" class="title">Bundle complete</text>
<text x="440" y="912" text-anchor="middle" class="sub">to Feature 2 — cumulative results</text>

<rect x="60" y="1000" width="16" height="16" class="optional"/>
<text x="86" y="1012" class="label">optional / non-blocking action</text>
<text x="60" y="1040" class="sub">Scope: single randomized 10-use-case bundle, per prototype scope. Use case domains are badges shown to the visitor.</text>
</svg>
